name: M1 benchmark candidates

on:
  push:
    branches:
      - m1/optics-benchmark
    paths:
      - "benchmarks/optics-spoon/**"
      - ".github/workflows/m1-benchmark-candidates.yml"
  pull_request:
    paths:
      - "benchmarks/optics-spoon/**"
      - ".github/workflows/m1-benchmark-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remotion:
    name: Remotion 4.0.547 — full film
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: benchmarks/optics-spoon/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg tools for media validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Render 72-second benchmark
        run: npm run render
      - name: Probe MP4
        run: |
          ffprobe -v error -show_streams -show_format -of json out/optics-spoon.mp4 > out/ffprobe.json
          cat out/ffprobe.json
          python - <<'PY'
          import json
          data = json.load(open("out/ffprobe.json", encoding="utf-8"))
          video = next(stream for stream in data["streams"] if stream["codec_type"] == "video")
          assert video["codec_name"] == "h264", video
          assert video["width"] == 1920 and video["height"] == 1080, video
          assert video["r_frame_rate"] == "24/1" and video["avg_frame_rate"] == "24/1", video
          assert int(video["nb_frames"]) == 1728, video
          assert abs(float(data["format"]["duration"]) - 72.0) < 0.1, data["format"]
          print("Remotion technical gate: H.264, 1920x1080, 24 fps, 72 seconds, 1728 frames")
          PY
      - name: Create Remotion contact sheet
        run: ffmpeg -y -i out/optics-spoon.mp4 -vf "fps=1/6,scale=480:-1,tile=4x3" -frames:v 1 out/contact-sheet.jpg
      - name: Upload Remotion candidate
        uses: actions/upload-artifact@v4
        with:
          name: m1-remotion-candidate
          path: |
            benchmarks/optics-spoon/remotion/out/optics-spoon.mp4
            benchmarks/optics-spoon/remotion/out/ffprobe.json
            benchmarks/optics-spoon/remotion/out/contact-sheet.jpg
          if-no-files-found: error
          retention-days: 30

  motion-canvas:
    name: Motion Canvas 3.17.2 — full film image-sequence render
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: benchmarks/optics-spoon/motion-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and type-check editor project
        run: npm run build
      - name: Render 1,728 frames through the official editor
        run: npm run render
      - name: Probe and verify Motion Canvas MP4
        run: |
          ffprobe -v error -show_streams -show_format -of json out/optics-spoon.mp4 > out/ffprobe.json
          cat out/ffprobe.json
          python - <<'PY'
          import json
          data = json.load(open("out/ffprobe.json", encoding="utf-8"))
          video = next(stream for stream in data["streams"] if stream["codec_type"] == "video")
          assert video["codec_name"] == "h264", video
          assert video["width"] == 1920 and video["height"] == 1080, video
          assert video["r_frame_rate"] == "24/1" and video["avg_frame_rate"] == "24/1", video
          assert int(video["nb_frames"]) == 1728, video
          assert abs(float(data["format"]["duration"]) - 72.0) < 0.1, data["format"]
          print("Motion Canvas technical gate: H.264, 1920x1080, 24 fps, 72 seconds, 1728 frames")
          PY
      - name: Upload Motion Canvas diagnostics even on render failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-motion-canvas-diagnostics
          path: |
            benchmarks/optics-spoon/motion-canvas/output/
            benchmarks/optics-spoon/motion-canvas/out/
            benchmarks/optics-spoon/motion-canvas/short-render-debug.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Motion Canvas candidate
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m1-motion-canvas-candidate
          path: |
            benchmarks/optics-spoon/motion-canvas/out/optics-spoon.mp4
            benchmarks/optics-spoon/motion-canvas/out/render-report.json
            benchmarks/optics-spoon/motion-canvas/out/ffprobe.json
            benchmarks/optics-spoon/motion-canvas/out/contact-sheet.jpg
          if-no-files-found: error
          retention-days: 30

  manim:
    name: Manim CE 0.22.1 — scientific segment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: benchmarks/optics-spoon/manim
    steps:
      - uses: actions/checkout@v4
      - name: Install system rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Manim fork
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Render scientific segment preview
        run: manim -qh -r 1920,1080 --fps 24 --media_dir out refraction_segment.py RefractionSegment
      - name: Probe Manim output
        run: |
          find out -type f -name 'RefractionSegment.mp4' -not -path '*/partial_movie_files/*' -print
          VIDEO="$(find out -type f -name 'RefractionSegment.mp4' -not -path '*/partial_movie_files/*' -print -quit)"
          test -n "$VIDEO"
          ffprobe -v error -show_streams -show_format -of json "$VIDEO" > out/ffprobe.json
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO" > out/duration.txt
          cat out/ffprobe.json
          python - <<'PY'
          import json
          data = json.load(open("out/ffprobe.json", encoding="utf-8"))
          video = next(stream for stream in data["streams"] if stream["codec_type"] == "video")
          assert video["codec_name"] == "h264", video
          assert video["width"] == 1920 and video["height"] == 1080, video
          from fractions import Fraction
          assert video["r_frame_rate"] == "24/1", video
          assert abs(float(Fraction(video["avg_frame_rate"])) - 24.0) < 0.01, video
          assert int(video["nb_frames"]) == 279, video
          print("Manim technical gate: H.264, 1920x1080, 24 fps, 279 frames")
          PY
          DURATION="$(cat out/duration.txt)"
          awk -v d="$DURATION" 'BEGIN { if (d < 5 || d > 30) exit 1; }'
          ffmpeg -y -i "$VIDEO" -vf "fps=1,scale=480:-1,tile=4x3" -frames:v 1 out/contact-sheet.jpg
      - name: Upload Manim segment
        uses: actions/upload-artifact@v4
        with:
          name: m1-manim-refraction-segment
          path: benchmarks/optics-spoon/manim/out/
          if-no-files-found: error
          retention-days: 30
